<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>ARSpace procedural model builder</title></head>
  <body>
    <p>Builds the procedural furniture GLBs. Open with <code>npm run dev</code> at /tools/build-models.html and press the button; each file downloads.</p>
    <button id="go">Build and download all</button>
    <script type="module">
      import { buildAll } from './procedural-models.js';
      window.__buildAll = async () => {
        const all = await buildAll();
        const out = {};
        for (const [id, buf] of Object.entries(all)) {
          let s = '';
          const a = new Uint8Array(buf);
          for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192));
          out[id] = btoa(s);
        }
        return out;
      };
      document.getElementById('go').addEventListener('click', async () => {
        const all = await buildAll();
        for (const [id, buf] of Object.entries(all)) {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' }));
          a.download = `${id}.glb`;
          a.click();
        }
      });
    </script>
  </body>
</html>
